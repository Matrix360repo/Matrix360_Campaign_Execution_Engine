# Restricted simulation staging. This does not authorize live outreach or production use.
# References the existing dedicated database; does not create or modify other workstreams.
services:
  - type: web
    name: matrix360-pratha-staging-v04
    runtime: python
    region: singapore
    plan: free
    rootDir: matrix_marketing_execution_core
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: MATRIX_ENV
        value: staging
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: MATRIX_EXEC_KEY
        generateValue: true
      - key: MATRIX_EMBEDDED_WORKER
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: matrix360-pratha-staging-db
          property: connectionString
