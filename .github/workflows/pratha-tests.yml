name: Pratha independent engine tests
on:
  push:
    paths: ['matrix_marketing_execution_core/**', '.github/workflows/pratha-tests.yml']
  pull_request:
    paths: ['matrix_marketing_execution_core/**', '.github/workflows/pratha-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matrix_marketing_execution_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
